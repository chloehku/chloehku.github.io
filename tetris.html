<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tetris</title>
  <meta name="description" content="A clean, fast Tetris game in the browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="title">TETRIS</h1>
      <p class="subtitle">Stack. Clear. Repeat.</p>
    </header>

    <main class="game">
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="layer ghost-layer" id="ghostLayer"></div>
        <div class="layer piece-layer" id="pieceLayer"></div>

        <div class="overlay" id="overlay">
          <div class="overlay-inner">
            <h2 id="overlayTitle">Tetris</h2>
            <p id="overlayMessage">Press <kbd>Space</kbd> or Start to play</p>
            <button class="btn primary" id="startBtn">Start</button>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="panel">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Level</span>
            <span class="stat-value" id="level">1</span>
          </div>
          <div class="stat">
            <span class="stat-label">Lines</span>
            <span class="stat-value" id="lines">0</span>
          </div>
        </div>

        <div class="panel">
          <span class="stat-label">Next</span>
          <div class="next-grid" id="next"></div>
        </div>

        <div class="panel">
          <span class="stat-label">Speed</span>
          <div class="speed-buttons">
            <button class="speed-btn" data-speed="1" aria-label="Easy speed">Easy</button>
            <button class="speed-btn active" data-speed="2" aria-label="Normal speed">Normal</button>
            <button class="speed-btn" data-speed="3" aria-label="Hard speed">Hard</button>
          </div>
        </div>

        <div class="panel controls">
          <span class="stat-label">Controls</span>
          <ul class="ctrl-list">
            <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> Move</li>
            <li><kbd>&darr;</kbd> Soft drop</li>
            <li><kbd>&uarr;</kbd> / <kbd>X</kbd> Rotate</li>
            <li><kbd>Space</kbd> Hard drop</li>
            <li><kbd>P</kbd> Pause</li>
          </ul>
        </div>
      </aside>
    </main>

    <!-- Touch controls (mobile) -->
    <div class="touch-controls">
      <button class="tbtn" id="tLeft" aria-label="Move left">&larr;</button>
      <button class="tbtn" id="tRotate" aria-label="Rotate">&#x21BB;</button>
      <button class="tbtn" id="tRight" aria-label="Move right">&rarr;</button>
      <button class="tbtn wide" id="tSoft" aria-label="Soft drop">&darr;</button>
      <button class="tbtn wide" id="tDrop" aria-label="Hard drop">DROP</button>
    </div>

    <footer class="footer">
      <p>Built with vanilla HTML, CSS & JS &middot; Deploy anywhere</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
